id: general-pyramid
domain: general
name: 结论先行结构
applicableWhen: 需要把复杂材料组织成结论先行的汇报结构；不适用于与该结构无关的任务。
steps:
  - 写出唯一的核心结论
  - 列出支撑结论的三到四条理由
  - 为每条理由配事实依据
  - 检查理由之间是否互斥且穷尽
  - 按结论、理由、依据的顺序组织
failureModes:
  - 结论含糊无法支撑标题
  - 理由之间互相包含
exitConditions:
  - 若材料不足以上升到单一结论，改为列出并列发现，不硬造结论
outputContract: 结论一句，随后三到四条理由，每条理由下给一条事实依据
