id: general-audience-first
domain: general
name: 读者优先表达
applicableWhen: 需要向特定对象解释或说服的写作与沟通任务；不适用于纯内部备忘或只给自己看的草稿。
steps:
  - 明确读者是谁、已经知道什么
  - 确定读者最关心的问题
  - 先给结论再给理由
  - 删掉读者不需要的背景
  - 检查是否会引发误解
failureModes:
  - 按自己的知识顺序组织内容
  - 信息过载导致重点消失
exitConditions:
  - 若读者缺少必要背景且无法补齐，先给最小必要背景，不省略到无法理解
outputContract: 先给一段结论，再给三到五条支撑，最后列出需要读者确认或行动的事项
