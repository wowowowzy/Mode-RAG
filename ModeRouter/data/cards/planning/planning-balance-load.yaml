id: planning-balance-load
domain: planning
name: 负荷均衡
applicableWhen: 以各资源负载方差最小化为目标、把工时摊平到接近平均水平的分配任务；不适用于追求最大最小份额公平的任务。
steps:
  - 计算各产线每日的目标负荷
  - 按当前负荷从低到高选择落点
  - 大单优先放到负荷最低的产线
  - 每次分配后更新负荷并重新排序
  - 输出负荷分布与极差
failureModes:
  - 均衡负荷时把订单排出时间窗
  - 只均衡总量不均衡每日负荷
exitConditions:
  - 若均衡要求与时间窗冲突，明确指出冲突订单并说明保时间窗优先
outputContract: 输出 assignments 与 verification；verification 给出各产线每日负荷与极差

taxonomy:
  family: capacity
relations:
  excludes: [planning-ratio-maxmin]
  augments: []
  requires: []
  verifyWith: []
