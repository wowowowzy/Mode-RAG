id: planning-constraint-relaxation
domain: planning
name: 约束逐条放宽
applicableWhen: 条件过紧导致无解、需要放宽并说明代价的任务；不适用于与该结构无关的任务。
steps:
  - 先验证原始约束是否有解
  - 无解时按影响面从大到小排出可放宽的约束
  - 每次只放宽一条并记录放宽幅度
  - 重新验证是否出现可行解
  - 输出放宽清单与对应代价
failureModes:
  - 一次放宽多条，无法判断哪条真正致命
  - 悄悄放宽硬约束却不声明
exitConditions:
  - 若放宽到业务上限仍无解，停止并报告需要重新谈判的约束集合
outputContract: 输出 assignments 与 verification；放宽的约束写进 verification 的 detail，并说明放宽幅度与代价
