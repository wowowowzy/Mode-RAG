id: general-decision-matrix
domain: general
name: 决策矩阵
applicableWhen: 对多个候选方案按维度加权打分并排序选优的决策任务；不适用于已有专用立场评判卡的单方论证任务。
steps:
  - 列出候选方案
  - 确定评价维度与权重
  - 逐项打分并写出依据
  - 检查权重变动是否改变结论
  - 给出推荐与前提
failureModes:
  - 维度重复计分
  - 权重事后调整以迎合偏好
exitConditions:
  - 若前两名差距小于权重误差范围，说明两者等价，改为按执行成本选择
outputContract: 分节输出 criteria / scores / sensitivity / recommendation

taxonomy:
  family: general
relations:
  excludes: [debate-criteria-first]
  augments: []
  requires: []
  verifyWith: []
